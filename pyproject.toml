[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "talonctl"
dynamic = ["version"]
description = "Infrastructure as code for CrowdStrike NGSIEM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Will Webster" }]
keywords = ["crowdstrike", "ngsiem", "detection-as-code", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "crowdstrike-falconpy>=1.6.1",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "click>=8.0.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=7.0.0",
    # Upper bound is deliberate. ruff 0.16 widened the default rule set and
    # changed formatter output, so CI (which installs the newest match) went from
    # green to 1,378 lint errors and 2 files needing reformatting on master —
    # without a single source change. An unpinned linter means CI breakage arrives
    # on an upstream release schedule rather than on a commit, and lands on
    # whichever PR is open at the time.
    #
    # Verified 2026-08-11: master is clean under 0.15.13 and fails under 0.16.2.
    # Adopting 0.16 is a real migration (~1,378 findings, mostly import ordering
    # and Optional[X] -> X | None) and belongs in its own PR, not smuggled into an
    # unrelated one. Raise this bound as part of that work.
    "ruff>=0.8.0,<0.17",
]

[project.scripts]
talonctl = "talonctl.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/talonctl"]
force-include = { "src/talonctl/schemas/envelope.schema.json" = "talonctl/schemas/envelope.schema.json" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/talonctl/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "integration: marks tests as integration tests",
    "live_api: marks tests that hit real API",
    "slow: marks slow tests",
    "unit: marks unit tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
